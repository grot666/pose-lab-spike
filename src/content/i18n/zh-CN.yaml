# 简体中文文案。所有用户可见文字只在此文件与 en.yaml 中配置（键必须一致）。
# 占位符：{subjectId} {pose} {seconds} {elapsed} {target} {round} {step} {total} {tier} {n} …
# 列表 = 每次随机取一条。`npm run dev` 下修改即热更新。

meta:
  lang_name: "简体中文"

ai:
  name: "观测者"

app:
  title: "POSE LAB 姿态实验室"
  subtitle: "行为服从性观测单元"
  consent_note: "成人、知情同意的角色扮演。所有视觉计算仅在本浏览器本地运行，不保存、不上传任何图像或视频。"
  start: "开始观测"
  loading_model: "正在载入姿态模型（{tier}）…"
  requesting_camera: "正在请求光学传感器…"
  camera_denied: "摄像头不可用或权限被拒绝。实验室看不见的东西，无法观测。"
  model_failed: "姿态模型载入失败：{error}"
  insecure_context: "摄像头需要 HTTPS（或 localhost）。请打开 npm run dev 输出的 https:// 地址。"
  safeword: "安全词"
  safeword_aria: "安全词：立即停止一切"
  next_round: "下一轮"
  wake_lock_failed: "屏幕可能会熄灭：无法保持常亮。"

subject:
  id_format: "S-{n}"
  label: "样本"

hud:
  subject: "样本 {subjectId}"
  round: "第 {round} 轮 · {step}/{total}"
  enter_countdown: "{seconds} 秒内就位"
  hold: "保持 {elapsed} / {target} 秒"
  paused: "计时已暂停"
  confidence: "匹配度 {pct}%"
  phase:
    idle: "待机"
    searching: "捕获中"
    command: "指令"
    entering: "等待服从"
    holding: "保持中"
    result: "记录中"
    report: "报告"
    stopped: "已停止"

status:
  idle:
    - "样本舱待机。准备好被测量时，按下开始。"
  searching:
    - "面向传感器，{subjectId}。全身入镜。实验室在等你。"
    - "后退。再后退。观测者需要看见你的全部。"
    - "未检测到样本。到传感器前报到。"
  person_found:
    - "样本 {subjectId} 已捕获。尽量别比上一个更让人失望。"
    - "找到你了。样本 {subjectId}，已登记。让我们看看你值几分。"
  entering:
    - "{pose}。现在。"
    - "{pose}。计时已经开始了，{subjectId}。"
    - "我说了，{pose}。做标准。"
  entered:
    - "勉强合格。保持住。"
    - "姿态已登记。不许动。"
    - "终于。就这样，一动别动。"
  holding:
    - "保持。每一次颤抖都在被记录。"
    - "别动。观测者正在测量你。"
    - "待着。数据不会自己采集。"
  leave:
    - "你动了。保持计时清零。重来。"
    - "姿态破坏。太散漫了，{subjectId}。从头开始。"
    - "我允许你动了吗？回到{pose}。"
  success:
    - "可以接受。记录为：服从。"
    - "保持完成。观测者……略感满意。"
    - "已记录。别因此得意。"
  fail_timeout:
    - "太慢了。记录为：不服从。"
    - "时间到。你的档案又厚了一页，{subjectId}。"
    - "失败已记录。意料之中。"
  track_lost:
    - "样本离开观测区。回到传感器前。计时已暂停。"
    - "你去哪儿了，{subjectId}？回到画面里。计时在等你。"
  track_regained:
    - "重新捕获。继续。"
    - "回来了。继续。"
  wrists_hidden:
    - "把手放在实验室看得见的地方。"
  lower_body_hidden:
    - "腿出画了。后退。"

poses:
  attention:
    name: "立正"
    command: "立正"
    instruction: "站直。双脚并拢，双臂伸直贴于身侧，下巴放平。"
  at_your_service:
    name: "听候差遣"
    command: "听候差遣"
    instruction: "挺身站立，双脚与肩同宽，双手在背后交握。"
  inspection:
    name: "受检"
    command: "受检"
    instruction: "双脚大幅分开。十指交叉抱于脑后，手肘向外打开。接受检查。"
  wait:
    name: "等候"
    command: "等候"
    instruction: "静立，双手在身前低处交握，低头。"
  kneel:
    name: "跪立"
    command: "跪下"
    instruction: "高跪：双膝着地，大腿与背部成一条直线。"
  nadu:
    name: "纳杜跪姿"
    command: "纳杜"
    instruction: "跪下并坐在脚跟上。双膝大开，掌心放在大腿上，背挺直，抬头。"
  collar_me:
    name: "为我戴上项圈"
    command: "项圈"
    instruction: "跪下。抬起下巴献出脖颈，双手在颈后托起头发。"

