  detect_error: "Face detector error: {error}"
  status:
    idle:
      - "Expression chamber idle. Press begin when you are ready to be measured."
    searching:
      - "Face the sensor, {subjectId}. Face in frame. The lab is waiting."
      - "Closer. The Observer needs a clear view of your face."
      - "No face detected. Present yourself to the sensor."
    person_found:
      - "Face acquired. Sample {subjectId}, expression sequence begins."
      - "There is your face. Do try to be less disappointing than the last one."
    entering:
      - "{pose}. Now."
      - "{pose}. The clock is running, {subjectId}."
      - "I said {pose}. Do it properly."
    entered:
      - "Expression registered. Hold it."
      - "Adequate. Do not move."
    holding:
      - "Hold. Every twitch is being recorded."
      - "Still. The Observer is measuring your face."
    leave:
      - "Broken expression. The hold timer resets. Again."
      - "Did I say you could change? Back into {pose}."
    success:
      - "Acceptable. Logged as compliant."
      - "Held. The Observer is… marginally satisfied."
    fail_timeout:
      - "Too slow. Logged as non-compliant."
      - "Time expired. Your file is getting longer, {subjectId}."
    track_lost:
      - "Face left the observation field. Return to the sensor. Timers are paused."
    track_regained:
      - "Reacquired. Continue."

expressions:
  neutral:
    name: "Neutral"
    command: "NEUTRAL"
    instruction: "Relax your face. No smile, no frown, mouth closed, eyes open."
  smile:
    name: "Smile"
