    instruction: "Raise brows, widen eyes, part the lips — as if startled."
  mouth_open:
    name: "Mouth Open"
    command: "MOUTH OPEN"
    instruction: "Open your jaw. Keep the tongue in."
  eyes_closed:
    name: "Eyes Closed"
    command: "EYES CLOSED"
    instruction: "Close both eyes fully. Hold."
  tongue_out:
    name: "Tongue Out"
    command: "TONGUE OUT"
    instruction: "Stick your tongue out. Webcam detection can be unreliable — do your best."

