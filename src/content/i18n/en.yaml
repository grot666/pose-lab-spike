# English copy. ALL user-facing text lives here and in zh-CN.yaml (same keys).
# Placeholders: {subjectId} {pose} {seconds} {elapsed} {target} {round} {step} {total} {tier} {n} ...
# A list value = random variant per use. Edits hot-reload in `npm run dev`.

meta:
  lang_name: "English"

ai:
  name: "OBSERVER"

app:
  title: "POSE LAB"
  subtitle: "Behavioural Compliance Observation Unit"
  consent_note: "Adult, consensual role-play. All vision processing runs locally in this browser. No image or video is stored or uploaded."
  start: "Begin observation"
  loading_model: "Loading posture model ({tier})…"
  requesting_camera: "Requesting optical sensor…"
  camera_denied: "Camera unavailable or permission denied. The lab cannot observe what it cannot see."
  model_failed: "Pose model failed to load: {error}"
  insecure_context: "Camera needs HTTPS (or localhost). Open the https:// URL printed by npm run dev."
  safeword: "SAFEWORD"
  safeword_aria: "Safeword: stop everything immediately"
  next_round: "Next round"
  wake_lock_failed: "Screen may dim: wake lock unavailable."

subject:
  id_format: "S-{n}"
  label: "Subject"

hud:
  subject: "Subject {subjectId}"
  round: "Round {round} · {step}/{total}"
  enter_countdown: "{seconds}s to comply"
  hold: "Hold {elapsed} / {target}s"
  paused: "TIMERS PAUSED"
  confidence: "Match {pct}%"
  phase:
    idle: "STANDBY"
    searching: "ACQUIRING"
    command: "INSTRUCTION"
    entering: "AWAITING COMPLIANCE"
    holding: "HOLDING"
    result: "LOGGING"
    report: "REPORT"
    stopped: "STOPPED"

status:
  idle:
    - "Specimen chamber idle. Press begin when you are ready to be measured."
  searching:
    - "Face the sensor, {subjectId}. Entire body in frame. The lab is waiting."
    - "Step back. Further. The Observer needs all of you in view."
    - "No specimen detected. Present yourself to the sensor."
  person_found:
    - "Specimen {subjectId} acquired. Do try to be less disappointing than the last one."
    - "There you are. Sample {subjectId}, logged. Let us see what you are worth."
  entering:
    - "{pose}. Now."
    - "{pose}. The clock is running, {subjectId}."
    - "I said {pose}. Do it properly."
  entered:
    - "Adequate. Hold it."
    - "Position registered. Do not move."
    - "Finally. Now stay exactly like that."
  holding:
    - "Hold. Every tremor is being recorded."
    - "Still. The Observer is measuring you."
    - "Stay put. Data does not collect itself."
  leave:
    - "You moved. The hold timer resets. Again."
    - "Broken position. That was sloppy, {subjectId}. Start over."
    - "Did I say you could move? Back into {pose}."
  success:
    - "Acceptable. Logged as compliant."
    - "Held. The Observer is… marginally satisfied."
    - "Recorded. Do not let it go to your head."
  fail_timeout:
    - "Too slow. Logged as non-compliant."
    - "Time expired. Your file is getting longer, {subjectId}."
    - "Failure recorded. Predictable."
  track_lost:
    - "Specimen left the observation field. Return to the sensor. Timers are paused."
    - "Where did you go, {subjectId}? Back in frame. The clock is waiting for you."
  track_regained:
    - "Reacquired. Continue."
    - "There you are. Resume."
  wrists_hidden:
    - "Hands where the lab can see them."
  lower_body_hidden:
    - "Legs out of frame. Step back."

poses:
  attention:
    name: "Attention"
    command: "ATTENTION"
    instruction: "Stand straight. Feet together, arms straight at your sides, chin level."
  at_your_service:
    name: "At Your Service"
    command: "AT YOUR SERVICE"
    instruction: "Stand tall, feet shoulder-width apart, hands clasped behind your back."
  inspection:
    name: "Inspection"
    command: "INSPECTION"
    instruction: "Feet wide apart. Fingers laced behind your head, elbows out. Be inspected."
  wait:
    name: "Wait"
    command: "WAIT"
    instruction: "Stand still, hands clasped low in front of you, head bowed."
  kneel:
    name: "Kneel"
    command: "KNEEL"
    instruction: "High kneel: knees on the floor, thighs and back in one straight line."
  nadu:
    name: "Nadu"
    command: "NADU"
    instruction: "Kneel and sit back on your heels. Knees wide, palms on thighs, back straight, head up."
  collar_me:
    name: "Collar Me"
    command: "COLLAR ME"
    instruction: "Kneel. Lift your chin to present your neck, hands holding your hair up at the nape."

